name: Baxışını dəyiş — Android APK

on:
  push:
    paths: ['baxisini-deyis/**', '.github/workflows/baxisini-deyis-android.yml']
  workflow_dispatch:

defaults:
  run:
    working-directory: baxisini-deyis

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: baxisini-deyis/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npx cap sync android
      - name: Build debug APK
        working-directory: baxisini-deyis/android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: baxisini-deyis-apk
          path: baxisini-deyis/android/app/build/outputs/apk/debug/app-debug.apk
